<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="175" viewBox="0 0 1200 175" role="img" aria-label="Fim da transmissão. @CESARKILL">
  <style>
    .horizon-glow { transform-origin: 600px 136px; animation: horizonGlow 2.4s cubic-bezier(0.16, 1, 0.3, 1) .15s backwards; }
    .end-text { animation: rise 1.3s cubic-bezier(0.16, 1, 0.3, 1) .35s backwards; }
    @keyframes horizonGlow { from { opacity: 0; transform: scale(.5, .25); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
  <defs>
    <clipPath id="foot-clip"><rect width="1200" height="175" rx="14"/></clipPath>
    <radialGradient id="sunrise" cx="600" cy="136" r="430" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 136) scale(1 0.32) translate(-600 -136)">
      <stop offset="0%" stop-color="#fff3de" stop-opacity="0.92"/>
      <stop offset="28%" stop-color="#ffae4c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffae4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#foot-clip)">
    <rect width="1200" height="175" fill="#070911"/>
    <ellipse class="horizon-glow" cx="600" cy="136" rx="430" ry="136" fill="url(#sunrise)"/>
    <circle cx="600" cy="2535" r="2400" fill="#05070e"/>
    <circle cx="600" cy="2535" r="2400" fill="none" stroke="url(#limb)" stroke-width="2"/>
    <g class="end-text" text-anchor="middle">
      <text x="605" y="64" font-family="'Segoe UI', 'Helvetica Neue', ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-weight="300" font-size="21" letter-spacing="11" fill="#f6f2ea">FIM DA TRANSMISSÃO</text>
      <text x="600" y="94" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.4" fill="#8a94ad">@CESARKILL · NOS VEMOS DO OUTRO LADO DO HORIZONTE</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="174" rx="14" fill="none" stroke="#1a2234"/>
</svg>
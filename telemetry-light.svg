<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Telemetria da missão HORIZONTE II: 2 anos no GitHub, 117 contribuições em 12 meses, 31 dias ativos, maior sequência de 4 dias, 11 repositórios, 69 commits totais.">
  <style>
    .orbit-path { stroke-dasharray: 473; animation: drawOrbit 1.8s cubic-bezier(0.16, 1, 0.3, 1) .15s backwards; }
    .orbit-fill { animation: fadeIn 1.4s ease-out .4s backwards; }
    .beacon-ping { transform-origin: 0px 0px; animation: beaconPing 2.4s ease-out infinite; }
    .card-in { animation: rise .9s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    .spec-bar { transform-origin: 470px 363px; animation: growBar 1.3s cubic-bezier(0.16, 1, 0.3, 1) .35s backwards; }
    .scan { animation: scanSweep 2.6s cubic-bezier(0.16, 1, 0.3, 1) .15s forwards; }
    @keyframes drawOrbit { from { stroke-dashoffset: 473; } to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes beaconPing { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes growBar { from { transform: scaleX(0); } }
    @keyframes scanSweep { 0% { opacity: .85; transform: translateX(0); } 80% { opacity: .45; } 100% { opacity: 0; transform: translateX(1170px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
